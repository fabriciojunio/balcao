name: CI

on:
  push:
    branches: ["produção", "homologação"]
  pull_request:
    branches: ["produção", "homologação"]

permissions:
  contents: read

jobs:
  qualidade:
    name: Qualidade de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validar configuracao das lojas
        run: npm run config:validar

      - name: Validar o schema do banco
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Testes com gate de cobertura
        run: npm run test:coverage

      - name: Conversa de demonstracao de ponta a ponta
        run: npm run demo

      - name: Auditoria de dependencias de producao
        run: npm run audit:prod -- --audit-level=high

  integracao:
    name: Testes de integracao (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: balcao_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci:ci@localhost:5432/balcao_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Aplicar o schema no banco
        run: npx prisma db push --skip-generate

      - name: Testes de integracao
        run: npm run test:integration

      - name: Carga inicial
        run: npm run db:seed

  seguranca:
    name: Analise de seguranca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Semgrep - analise estatica
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
