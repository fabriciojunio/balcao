name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  qualidade:
    name: Qualidade de codigo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar tipos TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Validar configuracao das lojas
        run: npm run config:validar

      - name: Validar o schema do banco
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Testes com gate de cobertura
        run: npm run test:coverage

      - name: Conversa de demonstracao de ponta a ponta
        run: npm run demo

      - name: Auditoria de dependencias de producao
        run: npm run audit:prod -- --audit-level=high

  seguranca:
    name: Analise de seguranca
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Semgrep - analise estatica
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/typescript
            p/nodejs
            p/owasp-top-ten
            p/secrets
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        continue-on-error: true
